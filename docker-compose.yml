services:
  dashboard:
    build: .
    env_file: .env
    ports:
      - '127.0.0.1:8501:8501'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  ingest:
    build: .
    env_file: .env
    command: ["uvicorn", "agentops.ingest:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
